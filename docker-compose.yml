services:
  # MongoDB database
  mongodb:
    image: mongo:7
    container_name: nimo-mongodb
    ports:
      - "5000:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
      - MONGO_INITDB_DATABASE=nimo

  # Backend API server
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nimo-server
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/nimo?authSource=admin
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - CLIENT_URL=http://localhost:5174
    depends_on:
      - mongodb
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

  # Frontend client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: nimo-client
    ports:
      - "5174:5173"
    environment:
      - VITE_API_URL=http://localhost:5001
    depends_on:
      - server
    restart: unless-stopped

volumes:
  mongodb_data:
  uploads_data:
